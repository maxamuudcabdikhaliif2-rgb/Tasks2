<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div>
 
        <h1 class="text-2xl sm:text-3xl font-bold text-center text-gray-800">
            Users Information
        </h1>
 
        <div class="hidden md:block overflow-x-auto bg-white rounded-xl shadow-lg">

            <table class="w-full text-left border-collapse">

                <thead>
                    <tr>
                        <th class="bg-blue-600 text-white p-4">Name</th>
                        <th class="bg-blue-600 text-white p-4">Email</th>
                        <th class="bg-blue-600 text-white p-4">Telephone</th>
                        <th class="bg-blue-600 text-white p-4">City</th>
                        <th class="bg-blue-600 text-white p-4">Company</th>
                    </tr>
                </thead>

                <tbody id="users" class="divide-y divide-gray-200">
                    <tr>
                        <td colspan="5" class="p-5 text-center">
                            Loading...
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>
 
        <div id="mobileUsers" class="md:hidden grid grid-cols-1 sm:grid-cols-2 gap-4">
            <p class="text-center col-span-full text-gray-500">
                Loading...
            </p>
        </div>

    </div>

    <script>

        const users = document.getElementById("users");
        const mobileUsers = document.getElementById("mobileUsers");

        fetch("https://jsonplaceholder.typicode.com/users")

            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch users");
                }

                return response.json();
            })

            .then(data => {

                users.innerHTML = "";
                mobileUsers.innerHTML = "";

                data.forEach(user => {

                    
                    users.innerHTML += `
                        <tr class="hover:bg-gray-50 transition">

                            <td class="p-4 font-semibold text-gray-800">
                                ${user.name}
                            </td>

                            <td class="p-4 text-gray-600">
                                ${user.email}
                            </td>

                            <td class="p-4 text-gray-600">
                                ${user.phone}
                            </td>

                            <td class="p-4 text-gray-600">
                                ${user.address.city}
                            </td>

                            <td class="p-4 text-gray-600">
                                ${user.company.name}
                            </td>

                        </tr>
                    `;

                    
                    mobileUsers.innerHTML += `
                        <div class="bg-white rounded-xl shadow-md p-5 border border-gray-100">

                            <h2 class="text-lg font-bold">
                                ${user.name}
                            </h2>

                            <div class="space-y-2 text-sm">

                                <p class="break-words">
                                    <span class="font-semibold text-red-600">Email:</span>
                                    ${user.email}
                                </p>

                                <p>
                                    <span class="font-semibold text-red-600">Telephone:</span>
                                    ${user.phone}
                                </p>

                                <p>
                                    <span class="font-semibold text-red-600">City:</span>
                                    ${user.address.city}
                                </p>

                                <p>
                                    <span class="font-semibold text-red-600">Company:</span>
                                    ${user.company.name}
                                </p>

                            </div>

                        </div>
                    `;

                });

            })

            .catch(error => {

                users.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-5 text-center text-red-500">
                            ${error.message}
                        </td>
                    </tr>
                `;

                mobileUsers.innerHTML = `
                    <p class="text-center text-red-500 col-span-full">
                        ${error.message}
                    </p>
                `;

            });

    </script>

</body>
</html>
